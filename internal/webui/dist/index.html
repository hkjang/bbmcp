<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bbmcp — 콘솔 빌드 필요</title>
    <style>
      body { font-family: system-ui, "Malgun Gothic", "Noto Sans KR", sans-serif;
             margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #f6f8fc; color: #16202e; line-height: 1.7; }
      main { max-width: 34rem; padding: 2rem; }
      code { background: #e7f1ff; border-radius: 6px; padding: 0.1em 0.4em; }
      a { color: #1f6feb; }
    </style>
  </head>
  <body>
    <main>
      <h1>웹 콘솔이 빌드되지 않았습니다</h1>
      <p>
        이 바이너리에는 React 콘솔이 포함되어 있지 않습니다. 소스에서 직접 빌드한
        경우에는 아래를 실행한 뒤 다시 빌드하십시오.
      </p>
      <pre><code>scripts/build.sh</code></pre>
      <p>
        배포용 이미지는 <code>scripts/build.sh --image</code> 로 만들며, 콘솔이 함께
        포함됩니다. REST 와 MCP 엔드포인트는 이 상태에서도 정상 동작합니다.
      </p>
      <p><a href="https://hkjang.github.io/bbmcp/">문서 보기</a></p>
    </main>
  </body>
</html>
